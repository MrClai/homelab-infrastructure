services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data # Persist the database data in a Docker volume
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro # Mount the schema.sql file to initialize the database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""] # Check if the PostgreSQL server is ready to accept connections
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    depends_on:
      db:
        condition: service_healthy # Wait for the database service to be healthy before starting the app service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"] # Check if the app service is healthy by making an HTTP request to the /health endpoint
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: